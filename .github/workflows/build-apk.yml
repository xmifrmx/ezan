name: APK derle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Web dosyalarını www klasörüne kopyala
        run: mkdir -p www && cp index.html manifest.webmanifest icon-192.png icon-512.png www/
      - run: npm install
      - run: npx cap add android
      - run: pip install pillow
      - name: Android projesini düzenle (izinler, simge, renkler)
        run: python3 scripts/patch_android.py
      - name: Canlı bildirim çubuğu kodunu ekle
        run: python3 scripts/patch_native_bar.py
      - run: npx cap sync android
      - name: APK derle (canlı bildirim çubuğuyla)
        id: nat
        continue-on-error: true
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Yedek derleme (canlı bildirim çubuğu olmadan)
        if: steps.nat.outcome == 'failure'
        run: |
          echo "::warning::Canlı bildirim çubuğu derlenemedi; APK bu özellik olmadan üretiliyor."
          python3 scripts/patch_native_bar.py remove
          cd android && ./gradlew clean assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk EzanVaktim.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EzanVaktim-apk
          path: EzanVaktim.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Ezan Vaktim APK ${{ github.run_number }}
          files: EzanVaktim.apk
